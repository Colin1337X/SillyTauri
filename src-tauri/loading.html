<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SillyTauri - Loading</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #eee;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            text-align: center;
            padding: 2rem;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(102, 126, 234, 0.3);
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 2rem auto;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .status {
            color: #aaa;
            font-size: 1.1rem;
        }
        .import-btn {
            margin-top: 2rem;
            padding: 0.75rem 1.5rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .import-btn:hover {
            opacity: 0.9;
        }
        .import-btn:active {
            transform: scale(0.98);
        }
        .import-result {
            margin-top: 1rem;
            padding: 0.5rem;
            font-size: 0.9rem;
            color: #8f8;
        }
        .import-result.error {
            color: #f88;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>SillyTauri</h1>
        <div class="spinner"></div>
        <p class="status">Starting server...</p>
        <button class="import-btn" onclick="importData()">Import Data from Previous Install</button>
        <p class="import-result" id="import-result"></p>
    </div>

    <script>
        const { invoke } = window.__TAURI__.core;

        async function importData() {
            const resultEl = document.getElementById('import-result');
            resultEl.textContent = 'Selecting file...';
            resultEl.className = 'import-result';
            try {
                const result = await invoke('pick_and_import_data');
                resultEl.textContent = result;
                resultEl.className = 'import-result';
            } catch (e) {
                resultEl.textContent = e;
                resultEl.className = 'import-result error';
            }
        }

        // Listen for server-started event
        if (window.__TAURI__ && window.__TAURI__.event) {
            window.__TAURI__.event.listen('server-started', (event) => {
                document.querySelector('.status').textContent = 'Server ready! Redirecting...';
                setTimeout(() => {
                    window.location.replace(event.payload.url);
                }, 500);
            });
        }
    </script>
</body>
</html>
